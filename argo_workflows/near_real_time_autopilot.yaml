apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: near-real-time-autopilot
  namespace: argo
  annotations:
    workflows.argoproj.io/pod-keep: "OnCompletion"
spec:
  ttlStrategy:
    secondsAfterCompletion: 86400
  entrypoint: main

  podResourceRequest:
    cpu: "100m"
    memory: "128Mi"
    ephemeral-storage: "1Gi"

  podSpecPatch: |
    initContainers:
    - name: init
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
    containers:
    - name: wait
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
    - name: main
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
          ephemeral-storage: "8Gi"

  artifactRepository:
    pvc:
      claimName: argo-workflows-share
      key: artifacts

  artifactGC:
    strategy: Never

  imagePullSecrets:
  - name: ghcr-secret

  volumes:
  - name: lake-drainage-volume
    persistentVolumeClaim:
      claimName: argo-workflows-share
  - name: gcp-creds
    secret:
      secretName: personal-gcp-creds
      items:
      - key: key.json
        path: application_default_credentials.json
  - name: earth-engine-creds
    secret:
      secretName: earth-engine-creds
      items:
      - key: credentials
        path: credentials

  templates:
  - name: main
    metadata:
      labels:
        long-running-job: "true"
    inputs: {}
    outputs: {}
    container:
      image: ghcr.io/permafrostdiscoverygateway/water_timeseries_argo_workflow:3-near-real-time-run-argo-workflow
      imagePullPolicy: Always
      resources:
        requests:
          memory: "32Gi"
          cpu: "8"
          ephemeral-storage: "8Gi"
      command: ["bash", "-c"]
      args:
        - |
          set -e
          set -x
          
          echo "=== STARTING NEAR REAL-TIME BREAKPOINT JOB (AUTOPILOT) ==="
          echo "Timestamp: $(date)"
          echo "Pod: ${POD_NAME:-unknown}"
          
          # Check resources
          echo "=== RESOURCE ALLOCATION ==="
          free -h
          echo "CPU count: $(nproc)"
          df -h /
          df -h /data
          
          # Debug Python environment
          echo "=== PYTHON ENVIRONMENT ==="
          which python
          python --version
          which pip
          pip --version
          
          echo "Python sys.path:"
          python -c "import sys; print('\n'.join(sys.path))"
          
          # Try multiple methods to install packages
          echo "=== INSTALLING PYTHON PACKAGES ==="
          
          # Method 1: Try uv
          if command -v uv &> /dev/null; then
            echo "Method 1: Using uv"
            uv pip install --system python-dotenv || true
          fi
          
          # Method 2: Try pip with --user
          echo "Method 2: Using pip with --user"
          pip install --user --no-cache-dir python-dotenv google-cloud-storage toml || true
          
          # Method 3: Try pip with --target
          echo "Method 3: Using pip with --target"
          mkdir -p /tmp/packages
          pip install --target=/tmp/packages --no-cache-dir python-dotenv google-cloud-storage toml || true
          export PYTHONPATH="/tmp/packages:${PYTHONPATH}"
          
          # Method 4: Direct download and install
          echo "Method 4: Direct download"
          curl -s https://bootstrap.pypa.io/get-pip.py | python
          pip install python-dotenv --no-cache-dir || true
          
          # Verify installations
          echo "=== VERIFYING INSTALLATIONS ==="
          
          # Check where pip installs packages
          echo "Pip show python-dotenv:"
          pip show python-dotenv || echo "Not found via pip show"
          
          # Try to import with different Python paths
          echo "Testing import with default PYTHONPATH:"
          python -c "import dotenv" 2>&1 || echo "Import failed"
          
          echo "Testing import with /tmp/packages:"
          PYTHONPATH="/tmp/packages" python -c "import dotenv" 2>&1 || echo "Import failed"
          
          # Find dotenv location
          echo "Searching for dotenv module:"
          find / -name "dotenv.py" -o -name "dotenv" -type d 2>/dev/null | head -10
          
          # List installed packages
          echo "Pip list:"
          pip list | grep -i dotenv || echo "dotenv not in pip list"
          
          # Create directories on PVC
          echo "=== CREATING DIRECTORIES ==="
          mkdir -p /data/water_timeseries/{dynamic_world_data,split_lakes,input,new_dynamic_world,split_new_dynamic_world,output,checkpoint,temp_netcdf,subsets,breakpoints}
          chmod -R 755 /data/water_timeseries
          
          # Set environment variables
          export TMPDIR=/data/water_timeseries/temp_netcdf
          export TEMP=/data/water_timeseries/temp_netcdf
          export TMP=/data/water_timeseries/temp_netcdf
          export PYTHONPATH="/tmp/packages:${PYTHONPATH}"
          
          # Check PVC space
          echo "=== PVC STORAGE ==="
          df -h /data
          
          # Create .env file
          echo "=== CREATING .env FILE ==="
          cat > /data/.env << 'EOF'
          project=pdg-project-406720
          vector_dataset_file_url=pdg-storage-default/water_timeseries_v2/data/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet
          bucket_path=pdg-storage-default/water_timeseries_v2/data/input
          base_dir=/data/water_timeseries
          dynamic_world_dir=/data/water_timeseries/dynamic_world_data
          split_vector_dataset_dir=/data/water_timeseries/split_lakes
          vector_lake_file=/data/water_timeseries/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet
          new_dynamic_world_data_dir=/data/water_timeseries/new_dynamic_world
          split_new_dynamic_world_data_dir=/data/water_timeseries/split_new_dynamic_world
          dynamic_world_data_file=/data/water_timeseries/input/lakes_dw_V2d.nc
          output_dir=/data/water_timeseries/output
          download_recent_data=False
          EOF
          
          # Set up credentials
          echo "=== SETTING UP CREDENTIALS ==="
          export GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
          export EARTHENGINE_TOKEN=/root/.config/earthengine/credentials
          export EE_CLOUD_PROJECT=pdg-wg-workflow
          export EE_PROJECT=pdg-project-406720
          
          # Create debug directory
          DEBUG_DIR="/data/water_timeseries/debug_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$DEBUG_DIR"
          
          # Final attempt: Install to the system Python directory
          echo "=== FINAL INSTALLATION ATTEMPT ==="
          sudo pip install python-dotenv google-cloud-storage toml 2>&1 || echo "sudo not available"
          
          # Run the script with explicit PYTHONPATH
          echo "=== RUNNING SCRIPT ==="
          cd /app
          echo "Current directory: $(pwd)"
          echo "Files in /app:"
          ls -la /app/
          echo "Files in /app/near_real_time:"
          ls -la /app/near_real_time/ || echo "Directory not found"
          
          # Try to run with detailed error
          export PYTHONPATH="/tmp/packages:/usr/local/lib/python3.12/site-packages:${PYTHONPATH}"
          echo "Final PYTHONPATH: $PYTHONPATH"
          
          python /app/near_real_time/near_real_time.py /data/.env 2>&1 | tee "$DEBUG_DIR/script_output.log"
          
          SCRIPT_EXIT_CODE=${PIPESTATUS[0]}
          
          echo "=== SCRIPT COMPLETED with exit code: $SCRIPT_EXIT_CODE ==="
          
          # Check for output files
          if [ -d "/data/water_timeseries/output" ]; then
            echo "Output files:"
            ls -lh /data/water_timeseries/output/
          fi
          
          exit $SCRIPT_EXIT_CODE
      env:
      - name: ENV_FILE_PATH
        value: "/data/.env"
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /root/.config/gcloud/application_default_credentials.json
      - name: EARTHENGINE_TOKEN
        value: /root/.config/earthengine/credentials
      - name: EE_CLOUD_PROJECT
        value: "pdg-wg-workflow"
      - name: EE_PROJECT
        value: "pdg-project-406720"
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: TMPDIR
        value: "/data/water_timeseries/temp_netcdf"
      volumeMounts:
      - name: gcp-creds
        mountPath: /root/.config/gcloud
        readOnly: true
      - name: earth-engine-creds
        mountPath: /root/.config/earthengine
        readOnly: true
      - name: lake-drainage-volume
        mountPath: /data