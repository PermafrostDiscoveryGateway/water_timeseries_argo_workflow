apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: near-real-time-autopilot
  namespace: argo
  annotations:
    workflows.argoproj.io/pod-keep: "OnCompletion"
spec:
  ttlStrategy:
    secondsAfterCompletion: 86400
  entrypoint: main

  # Set default resource requests for all pods in this workflow
  podResourceRequest:
    cpu: "100m"
    memory: "128Mi"
    ephemeral-storage: "1Gi"

  # Override resources for specific containers
  podSpecPatch: |
    initContainers:
    - name: init
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
    containers:
    - name: wait
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
    - name: main
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
          ephemeral-storage: "8Gi"

  # Configure artifact repository to use PVC
  artifactRepository:
    pvc:
      claimName: argo-workflows-share
      key: artifacts

  # Disable artifact GC
  artifactGC:
    strategy: Never

  imagePullSecrets:
  - name: ghcr-secret

  volumes:
  - name: lake-drainage-volume
    persistentVolumeClaim:
      claimName: argo-workflows-share
  - name: gcp-creds
    secret:
      secretName: personal-gcp-creds
      items:
      - key: key.json
        path: application_default_credentials.json
  - name: earth-engine-creds
    secret:
      secretName: earth-engine-creds
      items:
      - key: credentials
        path: credentials

  templates:
  - name: main
    metadata:
      labels:
        long-running-job: "true"
    # Disable automatic artifact passing
    inputs: {}
    outputs: {}
    container:
      image: ghcr.io/permafrostdiscoverygateway/water_timeseries_argo_workflow:3-near-real-time-run-argo-workflow
      imagePullPolicy: Always
      # These resources will be overridden by podSpecPatch above
      # but kept here as fallback
      resources:
        requests:
          memory: "32Gi"
          cpu: "8"
          ephemeral-storage: "8Gi"
      command: ["bash", "-c"]
      args:
        - |
          set -e
          set -x
          
          echo "=== STARTING NEAR REAL-TIME BREAKPOINT JOB (AUTOPILOT) ==="
          echo "Timestamp: $(date)"
          echo "Region: us-west1"
          echo "Pod: ${POD_NAME:-unknown}"
          
          # Check allocated resources
          echo "=== RESOURCE ALLOCATION ==="
          echo "Memory limit: $(cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null | numfmt --to=iec-i 2>/dev/null || echo 'Unknown')"
          echo "CPU count: $(nproc)"
          echo "Ephemeral storage available: $(df -h / | awk 'NR==2 {print $4}')"
          
          # IMPORTANT: Use PVC for large data, not ephemeral storage
          echo "=== CHECKING PVC STORAGE ==="
          df -h /data
          
          # Create ALL required directories on PVC (not ephemeral storage)
          echo "=== CREATING DIRECTORY STRUCTURE ON PVC ==="
          
          # Main directories from .env - all on /data (PVC)
          mkdir -p /data/water_timeseries
          mkdir -p /data/water_timeseries/dynamic_world_data
          mkdir -p /data/water_timeseries/split_lakes
          mkdir -p /data/water_timeseries/input
          mkdir -p /data/water_timeseries/new_dynamic_world
          mkdir -p /data/water_timeseries/split_new_dynamic_world
          mkdir -p /data/water_timeseries/output
          
          # Additional directories for processing - also on PVC
          mkdir -p /data/water_timeseries/checkpoint
          mkdir -p /data/water_timeseries/temp_netcdf
          mkdir -p /data/water_timeseries/subsets
          mkdir -p /data/water_timeseries/breakpoints
          
          # Set permissions
          chmod -R 755 /data/water_timeseries
          
          # Set TMPDIR to use PVC instead of ephemeral storage
          export TMPDIR=/data/water_timeseries/temp_netcdf
          export TEMP=/data/water_timeseries/temp_netcdf
          export TMP=/data/water_timeseries/temp_netcdf
          
          # Check available space on PVC
          echo "=== PVC STORAGE AVAILABLE ==="
          df -h /data
          AVAILABLE_GB=$(df /data | awk 'NR==2 {print $4}' | sed 's/G//')
          echo "Available space on PVC: ${AVAILABLE_GB}GB"
          
          if [ ${AVAILABLE_GB%.*} -lt 50 ]; then
            echo "WARNING: Less than 50GB available on PVC. May run out of space!"
          fi
          
          # Check if input files exist
          echo "=== CHECKING INPUT FILES ==="
          if [ ! -f "/data/water_timeseries/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet" ]; then
            echo "WARNING: Vector lake file not found. This may be expected if first run."
            ls -la /data/water_timeseries/input/ 2>/dev/null || echo "Input directory empty or missing"
          fi
          
          # Check for existing Dynamic World files
          if [ -d "/data/water_timeseries/dynamic_world_data" ]; then
            DW_COUNT=$(find /data/water_timeseries/dynamic_world_data -name "*.nc" 2>/dev/null | wc -l)
            echo "Found $DW_COUNT existing Dynamic World .nc files"
          fi
          
          # Create .env file in the expected location
          echo "=== CREATING .env FILE ==="
          cat > /data/.env << 'EOF'
          project=pdg-project-406720
          vector_dataset_file_url=pdg-storage-default/water_timeseries_v2/data/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet
          bucket_path=pdg-storage-default/water_timeseries_v2/data/input
          base_dir=/data/water_timeseries
          dynamic_world_dir=/data/water_timeseries/dynamic_world_data
          split_vector_dataset_dir=/data/water_timeseries/split_lakes
          vector_lake_file=/data/water_timeseries/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet
          new_dynamic_world_data_dir=/data/water_timeseries/new_dynamic_world
          split_new_dynamic_world_data_dir=/data/water_timeseries/split_new_dynamic_world
          dynamic_world_data_file=/data/water_timeseries/input/lakes_dw_V2d.nc
          output_dir=/data/water_timeseries/output
          download_recent_data=False
          EOF
          
          echo "Created .env file at /data/.env"
          
          # Check system resources
          echo "=== SYSTEM INFORMATION ==="
          echo "Memory info:"
          free -h
          echo "CPU info:"
          nproc
          cat /proc/cpuinfo | grep "model name" | head -1
          
          echo "Python version:"
          python --version
          
          # Set up credentials
          echo "=== SETTING UP CREDENTIALS ==="
          
          # GCP credentials
          export GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
          if [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "✅ GCP credentials found"
          else
            echo "❌ GCP credentials missing"
            ls -la /root/.config/gcloud/ 2>/dev/null || echo "Directory not found"
          fi
          
          # Earth Engine credentials
          export EARTHENGINE_TOKEN=/root/.config/earthengine/credentials
          if [ -f "$EARTHENGINE_TOKEN" ]; then
            echo "✅ Earth Engine credentials found"
          else
            echo "❌ Earth Engine credentials missing"
            ls -la /root/.config/earthengine/ 2>/dev/null || echo "Directory not found"
          fi
          
          # Set Earth Engine project
          export EE_CLOUD_PROJECT=pdg-wg-workflow
          export EE_PROJECT=pdg-project-406720
          
          # Environment variables dump (excluding secrets)
          echo "=== KEY ENVIRONMENT VARIABLES ==="
          env | grep -E "EE_|GOOGLE_|PROJECT|_DIR|_FILE|TMP" | sort
          
          # Create a debug directory for logs
          DEBUG_DIR="/data/water_timeseries/debug_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$DEBUG_DIR"
          
          # Run the near-real-time breakpoint script
          echo "=== RUNNING NEAR REAL-TIME BREAKPOINT SCRIPT ==="
          echo "Python script will load .env from: /data/.env"
          echo "Using TMPDIR: $TMPDIR"
          
          # Run the script with memory monitoring
          cd /app
          
          # Use time command to track resources
          /usr/bin/time -v python /app/near_real_time/near_real_time.py /data/.env 2>&1 | tee "$DEBUG_DIR/script_output.log"
          
          SCRIPT_EXIT_CODE=${PIPESTATUS[0]}
          
          echo "=== SCRIPT COMPLETED ==="
          echo "Exit code: $SCRIPT_EXIT_CODE"
          echo "Timestamp: $(date)"
          
          # Check for output files
          echo "=== CHECKING OUTPUT ==="
          if [ -d "/data/water_timeseries/output" ]; then
            echo "Output directory contents:"
            ls -lh /data/water_timeseries/output/
            OUTPUT_COUNT=$(find /data/water_timeseries/output -type f -name "*.csv" -o -name "*.parquet" 2>/dev/null | wc -l)
            echo "Total output files: $OUTPUT_COUNT"
            
            if [ $OUTPUT_COUNT -gt 0 ]; then
              echo "✅ Successfully generated output files"
              # List the most recent output files
              find /data/water_timeseries/output -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -5 | cut -d' ' -f2-
            fi
          else
            echo "❌ Output directory not found or empty"
          fi
          
          # Clean up temp files if successful
          if [ $SCRIPT_EXIT_CODE -eq 0 ]; then
            echo "=== CLEANING UP TEMP FILES ==="
            rm -rf /data/water_timeseries/temp_netcdf/*
            rm -rf /data/water_timeseries/checkpoint/*
            echo "Temp files cleaned"
          fi
          
          # Capture additional diagnostics if script failed
          if [ $SCRIPT_EXIT_CODE -ne 0 ]; then
            echo "=== SCRIPT FAILED - CAPTURING DEBUG INFO ==="
            
            echo "=== Python package versions ==="
            pip list | grep -E "xarray|pandas|loguru|earthengine|google" || echo "pip not available"
            
            echo "=== Directory structure ==="
            find /data/water_timeseries -type d | head -20
            
            echo "=== Available .nc files ==="
            find /data -name "*.nc" 2>/dev/null | head -10
            
            echo "=== Memory usage at failure ==="
            free -h
            
            echo "=== Disk usage at failure ==="
            df -h /data
            df -h /
            
            echo "=== Last 100 lines of script output ==="
            tail -100 "$DEBUG_DIR/script_output.log"
            
            # Create marker file for debugging
            touch "$DEBUG_DIR/DEBUG_MODE_ACTIVE"
            echo "Debug information saved to: $DEBUG_DIR"
          fi
          
          exit $SCRIPT_EXIT_CODE
      env:
      - name: ENV_FILE_PATH
        value: "/data/.env"
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /root/.config/gcloud/application_default_credentials.json
      - name: EARTHENGINE_TOKEN
        value: /root/.config/earthengine/credentials
      - name: EE_CLOUD_PROJECT
        value: "pdg-wg-workflow"
      - name: EE_PROJECT
        value: "pdg-project-406720"
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: TMPDIR
        value: "/data/water_timeseries/temp_netcdf"
      volumeMounts:
      - name: gcp-creds
        mountPath: /root/.config/gcloud
        readOnly: true
      - name: earth-engine-creds
        mountPath: /root/.config/earthengine
        readOnly: true
      - name: lake-drainage-volume
        mountPath: /data