apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: near-real-time-autopilot
  namespace: argo
  annotations:
    workflows.argoproj.io/pod-keep: "OnCompletion"
spec:
  ttlStrategy:
    secondsAfterCompletion: 86400
  entrypoint: main

  podResourceRequest:
    cpu: "100m"
    memory: "128Mi"
    ephemeral-storage: "1Gi"

  podSpecPatch: |
    initContainers:
    - name: init
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
    containers:
    - name: wait
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
    - name: main
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
          ephemeral-storage: "8Gi"
        limits:
          cpu: "16"
          memory: "48Gi"  # Higher limit
          ephemeral-storage: "16Gi"

  artifactRepository:
    pvc:
      claimName: argo-workflows-share
      key: artifacts

  artifactGC:
    strategy: Never

  imagePullSecrets:
  - name: ghcr-secret

  volumes:
  - name: lake-drainage-volume
    persistentVolumeClaim:
      claimName: argo-workflows-share
  - name: gcp-creds
    secret:
      secretName: personal-gcp-creds
      items:
      - key: key.json
        path: application_default_credentials.json
  - name: earth-engine-creds
    secret:
      secretName: earth-engine-creds
      items:
      - key: credentials
        path: credentials

  templates:
  - name: main
    metadata:
      labels:
        long-running-job: "true"
    inputs: {}
    outputs: {}
    container:
      image: ghcr.io/permafrostdiscoverygateway/water_timeseries_argo_workflow:19-download-and-process-over-grid-tiles
      imagePullPolicy: Always
      resources:
        requests:
          memory: "32Gi"
          cpu: "8"
          ephemeral-storage: "8Gi"
      command: ["bash", "-c"]
      args:
        - |
          set -e
          set -x
          
          echo "=== STARTING NEAR REAL-TIME BREAKPOINT JOB (AUTOPILOT) ==="
          echo "Timestamp: $(date)"
          echo "Pod: ${POD_NAME:-unknown}"
          
          # Check resources
          echo "=== RESOURCE ALLOCATION ==="
          free -h
          echo "CPU count: $(nproc)"
          df -h /
          df -h /data
          
          # Debug Python environment
          echo "=== PYTHON ENVIRONMENT ==="
          which python
          python --version
          which pip
          pip --version
          
          echo "Python sys.path:"
          python -c "import sys; print('\n'.join(sys.path))"
          
          # Try multiple methods to install packages
          echo "=== INSTALLING PYTHON PACKAGES ==="
          
          # Install Dask and dependencies first (required for new functionality)
          echo "=== INSTALLING DASK AND DEPENDENCIES ==="
          
          # Method 1: Try uv
          if command -v uv &> /dev/null; then
            echo "Method 1: Using uv"
            uv pip install --system python-dotenv dask[dataframe] pyarrow || true
          fi
          
          # Method 2: Try pip with --user
          echo "Method 2: Using pip with --user"
          pip install --user --no-cache-dir python-dotenv google-cloud-storage toml dask[dataframe] pyarrow || true
          
          # Method 3: Try pip with --target
          echo "Method 3: Using pip with --target"
          mkdir -p /tmp/packages
          pip install --target=/tmp/packages --no-cache-dir python-dotenv google-cloud-storage toml dask[dataframe] pyarrow || true
          export PYTHONPATH="/tmp/packages:${PYTHONPATH}"
          
          # Method 4: Direct download and install
          echo "Method 4: Direct download"
          curl -s https://bootstrap.pypa.io/get-pip.py | python
          pip install python-dotenv dask[dataframe] pyarrow --no-cache-dir || true
          
          # Verify Dask installation
          echo "=== VERIFYING DASK INSTALLATION ==="
          
          # Check Dask version and components
          python -c "import dask; print(f'Dask version: {dask.__version__}')" 2>&1 || echo "Dask import failed"
          python -c "import dask.dataframe; print('Dask dataframe module loaded successfully')" 2>&1 || echo "Dask dataframe import failed"
          python -c "import pyarrow; print(f'PyArrow version: {pyarrow.__version__}')" 2>&1 || echo "PyArrow import failed"
          
          # Check Dask configuration
          echo "Dask configuration:"
          python -c "import dask; print(dask.config.config)" 2>&1 | head -20 || echo "Cannot get Dask config"
          
          # Verify other installations
          echo "=== VERIFYING OTHER INSTALLATIONS ==="
          
          # Check where pip installs packages
          echo "Pip show python-dotenv:"
          pip show python-dotenv || echo "Not found via pip show"
          echo "Pip show dask:"
          pip show dask || echo "Not found via pip show"
          echo "Pip show pyarrow:"
          pip show pyarrow || echo "Not found via pip show"
          
          # install geemap version 0.37.2 here
           # Install geemap version 0.37.2
          # echo "=== INSTALLING GEEMAP 0.37.2 ==="
          # echo "Installing geemap version 0.37.2..."
          # Uninstall any existing geemap first
          # pip uninstall -y geemap eemont 2>/dev/null || true
          
          # Install exact version with no dependencies upgrade
          # pip install --no-cache-dir geemap==0.37.2
          
          # Install its dependencies separately to avoid version conflicts
          # pip install --no-cache-dir earthengine-api>=1.6.12 ipyleaflet folium bqplot ipywidgets
          
          #Verify geemap installation
          echo "=== VERIFYING GEEMAP INSTALLATION ==="
          python << 'EOF'
          import sys
          try:
              import geemap
              version = getattr(geemap, '__version__', 'unknown')
              has_ee_init = hasattr(geemap, 'ee_initialize')
              has_initialize = hasattr(geemap, 'initialize')
              
              print("=" * 50)
              print("GEEMAP VERIFICATION")
              print("=" * 50)
              print("geemap version: {}".format(version))
              print("geemap location: {}".format(geemap.__file__))
              print("Has ee_initialize: {}".format(has_ee_init))
              print("Has initialize: {}".format(has_initialize))
              
              if has_ee_init:
                  print("SUCCESS: geemap.ee_initialize is available")
              else:
                  print("WARNING: geemap.ee_initialize is missing")
                  # Try to see what functions are available
                  attrs = [attr for attr in dir(geemap) if not attr.startswith('_')][:20]
                  print("Available geemap attributes: {}".format(attrs))
                  
          except ImportError as e:
              print("ERROR: Failed to import geemap: {}".format(e))
          except Exception as e:
              print("ERROR: Unexpected error: {}".format(e))
          
          EOF
          GEEMAP_CHECK=$?
          if [ $GEEMAP_CHECK -ne 0 ]; then
            echo "ERROR: Geemap verification failed!"
          fi
          echo "=== GEEMAP INSTALLATION SUCCESSFUL ==="

          
          # Try to import with different Python paths
          echo "Testing import with default PYTHONPATH:"
          python -c "import dotenv, dask, pyarrow" 2>&1 || echo "Import failed"
          
          echo "Testing import with /tmp/packages:"
          PYTHONPATH="/tmp/packages" python -c "import dotenv, dask, pyarrow" 2>&1 || echo "Import failed"
          
          # Fix Earth Engine credentials - replace symlink with real file in the same location
          # This doesn't affect the original secret on disk, only the in-memory mount
          echo "=== FIXING EARTH ENGINE CREDENTIALS PATH ==="
            
          # The original location is a tmpfs mount (in memory)
          # We can create a real file there since it's writable (tmpfs is writable)
          # Copy the credentials to a real file in the same directory
          cp -L /root/.config/earthengine/credentials /root/.config/earthengine/credentials.real
            
          # Remove the symlink (it's in a tmpfs, won't affect the original secret)
          rm -f /root/.config/earthengine/credentials
            
          # Copy the real file to the expected location
          cp /root/.config/earthengine/credentials.real /root/.config/earthengine/credentials
            
          # Also create in the alternate location
          mkdir -p /root/.earthengine
          cp /root/.config/earthengine/credentials /root/.earthengine/credentials
            
          # Verify it's now a real file
          echo "Credentials file type:"
          ls -la /root/.config/earthengine/credentials
          file /root/.config/earthengine/credentials
          head -c 100 /root/.config/earthengine/credentials
            
          # Test JSON parsing
          python -c "import json; json.load(open('/root/.config/earthengine/credentials')); print('✓ Credentials valid')"
          
          # Find module locations
          echo "Searching for modules:"
          find / -name "dask" -type d 2>/dev/null | head -5
          find / -name "pyarrow" -type d 2>/dev/null | head -5
          find / -name "dotenv.py" -o -name "dotenv" -type d 2>/dev/null | head -10
          
          # List installed packages
          echo "Pip list (filtered):"
          pip list | grep -E "dask|pyarrow|dotenv" || echo "Packages not in pip list"
          
          
          
          # Create directories on PVC
          echo "=== CREATING DIRECTORIES ==="
          mkdir -p /data/water_timeseries/{dynamic_world_data,split_lakes,input,new_dynamic_world,split_new_dynamic_world,output,checkpoint,temp_netcdf,subsets,breakpoints}
          chmod -R 755 /data/water_timeseries
          
          # Create Dask workspace directory for temporary files
          mkdir -p /data/water_timeseries/dask_work_space
          chmod 755 /data/water_timeseries/dask_work_space
          
          # Set environment variables
          export TMPDIR=/data/water_timeseries/temp_netcdf
          export TEMP=/data/water_timeseries/temp_netcdf
          export TMP=/data/water_timeseries/temp_netcdf
          export PYTHONPATH="/tmp/packages:${PYTHONPATH}"
          
          # Dask-specific environment variables
          export DASK_TEMPORARY_DIRECTORY=/data/water_timeseries/dask_work_space
          export DASK_DISTRIBUTED__WORKER__MEMORY__TARGET=0.7
          export DASK_DISTRIBUTED__WORKER__MEMORY__SPILL=0.8
          export DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE=0.95
          export DASK_LOGGING__DISTRIBUTED=WARNING
          
          # Set number of threads for Dask (use available cores)
          export DASK_NUM_THREADS=$(nproc)
          echo "Setting DASK_NUM_THREADS=$DASK_NUM_THREADS"
          
          echo "=== EARTH ENGINE CREDENTIALS DEBUG ==="
          echo "EARTHENGINE_TOKEN path: ${EARTHENGINE_TOKEN}"
          ls -la /root/.config/earthengine/
          echo "File permissions:"
          stat /root/.config/earthengine/credentials
          echo "File size:"
          wc -c /root/.config/earthengine/credentials
          echo "First 50 chars of file:"
          head -c 50 /root/.config/earthengine/credentials
          echo ""
          echo "Full file content (first 200 chars):"
          cat /root/.config/earthengine/credentials | head -c 200
          echo ""
          
          # Test JSON parsing
          echo "Testing JSON parsing:"
          python << 'EOF'
          import json
          import os
          
          cred_path = '/root/.config/earthengine/credentials'
          print(f"Reading from: {cred_path}")
          print(f"File exists: {os.path.exists(cred_path)}")
          print(f"File size: {os.path.getsize(cred_path)} bytes")
          
          try:
              with open(cred_path, 'r') as f:
                  content = f.read()
                  print(f"Content length: {len(content)} chars")
                  print(f"First 100 chars: {content[:100]}")
                  data = json.loads(content)
                  print(f"✓ JSON valid! Keys: {list(data.keys())}")
          except Exception as e:
              print(f"✗ JSON error: {e}")
          EOF
          
          # Check PVC space
          echo "=== PVC STORAGE ==="
          df -h /data
          
          # Check available memory for Dask
          echo "=== MEMORY INFO FOR DASK ==="
          free -h
          echo "Available memory for Dask workers: $(free -g | awk '/^Mem:/{print $7}') GB"
          
          # Create .env file
          echo "=== CREATING .env FILE ==="
          cat > /data/.env << 'EOF'
          project=pdg-project-406720
          vector_dataset_file_url=pdg-storage-default/water_timeseries_v2/data/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet
          bucket_path=pdg-storage-default/water_timeseries_v2/data/input
          base_dir=/data/water_timeseries
          dynamic_world_dir=/data/water_timeseries/dynamic_world_data
          dynamic_world_data=/data/water_timeseries/dynamic_world_data
          dynamic_world_downloads=/data/water_timeseries/dynamic_world_data/downloads
          vector_lake_file=/data/water_timeseries/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet
          output_dir=/data/water_timeseries/output
          EOF
          
          # Set up credentials
          echo "=== SETTING UP CREDENTIALS ==="
          export GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
          export EARTHENGINE_TOKEN=/root/.config/earthengine/credentials
          export EE_CLOUD_PROJECT=pdg-wg-workflow
          export EE_PROJECT=pdg-project-406720
          
          # Create debug directory
          DEBUG_DIR="/data/water_timeseries/debug_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$DEBUG_DIR"
          
          # Save environment info for debugging
          echo "=== SAVING ENVIRONMENT INFO ==="
          env | sort > "$DEBUG_DIR/environment.txt"
          pip list > "$DEBUG_DIR/pip_list.txt"
          python -c "import sys; print(sys.path)" > "$DEBUG_DIR/python_path.txt"
          
          # Test Dask functionality before running main script
          echo "=== TESTING DASK FUNCTIONALITY ==="
          python -c "
          import dask.dataframe as dd
          import pandas as pd
          import tempfile
          import os
          
          print('Testing Dask with small DataFrame...')
          # Create test data
          test_df = pd.DataFrame({'a': range(100), 'b': range(100, 200)})
          test_file = os.path.join('/data/water_timeseries/dask_work_space', 'test.parquet')
          test_df.to_parquet(test_file)
          
          # Read with Dask
          ddf = dd.read_parquet(test_file)
          result = ddf.compute()
          print(f'Dask test successful! Result shape: {result.shape}')
          # print(f'Dask version: {dd.__version__}')

          # Clean up
          os.remove(test_file)
          print('Dask is working correctly!')
          " 2>&1 | tee "$DEBUG_DIR/dask_test.log"
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "ERROR: Dask test failed! Check $DEBUG_DIR/dask_test.log"
            exit 1
          fi
          
          # Final attempt: Install to the system Python directory
          echo "=== FINAL INSTALLATION ATTEMPT ==="
          sudo pip install python-dotenv dask[dataframe] pyarrow google-cloud-storage toml 2>&1 || echo "sudo not available"
          
          # Run the script with explicit PYTHONPATH
          echo "=== RUNNING SCRIPT ==="
          cd /app
          echo "Current directory: $(pwd)"
          echo "Files in /app:"
          ls -la /app/
          echo "Files in /app/near_real_time:"
          ls -la /app/near_real_time/ || echo "Directory not found"
          
          # Try to run with detailed error
          export PYTHONPATH="/tmp/packages:/usr/local/lib/python3.12/site-packages:${PYTHONPATH}"
          echo "Final PYTHONPATH: $PYTHONPATH"

          # Set Dask scheduler to use threads (local cluster)
          export DASK_SCHEDULER=threads
          
          echo "Starting near_real_time_cron.py with Dask support..."
          python /app/near_real_time/near_real_time_grid.py /data/.env 2>&1 | tee "$DEBUG_DIR/script_output.log"
          
          SCRIPT_EXIT_CODE=${PIPESTATUS[0]}

          echo "=== SCRIPT COMPLETED with exit code: $SCRIPT_EXIT_CODE ==="

          # Check for output files
          if [ -d "/data/water_timeseries/output" ]; then
            echo "Output files:"
            ls -lh /data/water_timeseries/output/
            
            # Check for combined parquet files
            echo "Combined results files:"
            ls -lh /data/water_timeseries/output/*.parquet 2>/dev/null || echo "No parquet files found"
            
            # Display file sizes
            echo "File sizes:"
            du -sh /data/water_timeseries/output/* 2>/dev/null || echo "No output files"
          fi
          
          # Check Dask workspace usage
          if [ -d "/data/water_timeseries/dask_work_space" ]; then
            echo "Dask workspace size:"
            du -sh /data/water_timeseries/dask_work_space
          fi

          echo "=== DEBUG INFO SAVED TO: $DEBUG_DIR ==="

          exit $SCRIPT_EXIT_CODE
      env:
      - name: lake_chunk_size
        value: "20000"
      - name: ENV_FILE_PATH
        value: "/data/.env"
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /root/.config/gcloud/application_default_credentials.json
      - name: EARTHENGINE_TOKEN
        value: /root/.config/earthengine/credentials
      - name: EE_CLOUD_PROJECT
        value: "pdg-wg-workflow"
      - name: EE_PROJECT
        value: "pdg-project-406720"
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: TMPDIR
        value: "/data/water_timeseries/temp_netcdf"
      - name: DASK_TEMPORARY_DIRECTORY
        value: "/data/water_timeseries/dask_work_space"
      - name: DASK_NUM_THREADS
        valueFrom:
          resourceFieldRef:
            resource: limits.cpu
            divisor: "1"
      - name: OMP_NUM_THREADS
        value: "1"  # Prevent numpy from oversubscribing threads
      volumeMounts:
      - name: gcp-creds
        mountPath: /root/.config/gcloud
        readOnly: true
      - name: earth-engine-creds
        mountPath: /root/.config/earthengine
        readOnly: true
      - name: lake-drainage-volume
        mountPath: /data