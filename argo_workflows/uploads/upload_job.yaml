apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: upload-output-to-gcs
  namespace: argo
  annotations:
    workflows.argoproj.io/pod-keep: "OnCompletion"
spec:
  ttlStrategy:
    secondsAfterCompletion: 86400
  entrypoint: main

  podResourceRequest:
    cpu: "100m"
    memory: "128Mi"
    ephemeral-storage: "1Gi"

  podSpecPatch: |
    initContainers:
    - name: init
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
    containers:
    - name: wait
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
    - name: main
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
          ephemeral-storage: "2Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
          ephemeral-storage: "4Gi"

  artifactRepository:
    pvc:
      claimName: argo-workflows-share
      key: artifacts

  artifactGC:
    strategy: Never

  imagePullSecrets:
  - name: ghcr-secret

  volumes:
  - name: lake-drainage-volume
    persistentVolumeClaim:
      claimName: argo-workflows-share
  - name: gcp-creds
    secret:
      secretName: personal-gcp-creds
      items:
      - key: key.json
        path: application_default_credentials.json

  templates:
  - name: main
    metadata:
      labels:
        upload-job: "true"
    inputs: {}
    outputs:
      artifacts:
      - name: workflow-output
        path: /tmp/workflow_output.log
        archive:
          none: {}
    container:
      image: ghcr.io/permafrostdiscoverygateway/water_timeseries_argo_workflow:27-create-near-real-time-cron-job
      imagePullPolicy: Always
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
          ephemeral-storage: "2Gi"
      command: ["bash", "-c"]
      args:
        - |
          set -e
          set -x
          
          # Create log directory and file for artifact
          mkdir -p /tmp
          exec > >(tee -a /tmp/workflow_output.log) 2>&1
          
          echo "=== STARTING UPLOAD JOB ==="
          echo "Timestamp: $(date)"
          echo "Pod: ${POD_NAME:-unknown}"
          
          # Check resources
          echo "=== RESOURCE ALLOCATION ==="
          free -h
          df -h /
          df -h /data
          
          # Debug Python environment
          echo "=== PYTHON ENVIRONMENT ==="
          which python
          python --version
          
          # Set Google Cloud credentials
          export GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
          
          # Verify credentials exist
          echo "=== VERIFYING GCP CREDENTIALS ==="
          if [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "✓ GCP credentials found at $GOOGLE_APPLICATION_CREDENTIALS"
            ls -la $GOOGLE_APPLICATION_CREDENTIALS
          else
            echo "✗ GCP credentials not found!"
            exit 1
          fi
          
          # Clean PYTHONPATH - use only the venv
          export PYTHONPATH="/app/.venv/lib/python3.12/site-packages:/app"
          
          # Install google-cloud-storage if not already installed
          echo "=== INSTALLING GOOGLE CLOUD STORAGE LIBRARY ==="
          pip install google-cloud-storage --quiet || echo "Library already installed or installation failed"
          
          # Check if output directory exists
          UPLOAD_PATH="/data/water_timeseries/output"
          echo "=== CHECKING UPLOAD PATH ==="
          if [ ! -d "$UPLOAD_PATH" ]; then
            echo "✗ Output directory $UPLOAD_PATH does not exist!"
            echo "Available directories in /data/water_timeseries/:"
            ls -la /data/water_timeseries/ || echo "Directory not found"
            exit 1
          fi
          
          echo "✓ Output directory exists: $UPLOAD_PATH"
          echo "Contents of $UPLOAD_PATH:"
          ls -lh $UPLOAD_PATH/
          
          # Count files to upload
          FILE_COUNT=$(find $UPLOAD_PATH -type f | wc -l)
          echo "Found $FILE_COUNT files to upload"
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠ No files found to upload!"
            exit 0
          fi
          
          # Run the upload script from the app
          echo "=== RUNNING UPLOAD SCRIPT ==="
          cd /app
          python /app/upload_utils/upload_to_cloud_bucket.py /data/water_timeseries/output \
            --bucket pdg-storage-default \
            --base-path water_timeseries_v2/test_data/test_output \
            --workers 5
          
          UPLOAD_EXIT_CODE=$?
          
          if [ $UPLOAD_EXIT_CODE -eq 0 ]; then
            echo "✓ Upload completed successfully!"
          else
            echo "✗ Upload failed with exit code: $UPLOAD_EXIT_CODE"
          fi
          
          # Verify upload by listing bucket contents (optional)
          echo "=== VERIFYING UPLOAD (listing bucket) ==="
          python -c "
          from google.cloud import storage
          from datetime import datetime
          client = storage.Client()
          bucket = client.bucket('pdg-storage-default')
          date_folder = datetime.now().strftime('%Y%m%d')
          prefix = f'water_timeseries_v2/test_data/test_output/{date_folder}/'
          blobs = list(bucket.list_blobs(prefix=prefix, max_results=10))
          print(f'Found {len(blobs)} blobs in {prefix}')
          for blob in blobs[:5]:
              print(f'  - {blob.name} ({blob.size} bytes)')
          if len(blobs) > 5:
              print(f'  ... and {len(blobs)-5} more')
          "
          
          # Save upload info to PVC for reference
          DEBUG_DIR="/data/water_timeseries/upload_debug_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$DEBUG_DIR"
          
          echo "=== SAVING UPLOAD INFORMATION ==="
          echo "Upload completed at: $(date)" > "$DEBUG_DIR/upload_info.txt"
          echo "Upload path: /data/water_timeseries/output" >> "$DEBUG_DIR/upload_info.txt"
          echo "Destination: gs://pdg-storage-default/water_timeseries_v2/test_data/test_output/$(date +%Y%m%d)/" >> "$DEBUG_DIR/upload_info.txt"
          echo "Files uploaded: $FILE_COUNT" >> "$DEBUG_DIR/upload_info.txt"
          
          echo "=== DEBUG INFO SAVED TO: $DEBUG_DIR ==="
          echo "=== FULL LOG SAVED TO: /tmp/workflow_output.log ==="
          
          # Ensure everything is flushed to disk
          sync
          
          exit $UPLOAD_EXIT_CODE
      env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /root/.config/gcloud/application_default_credentials.json
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: PYTHONUNBUFFERED
        value: "1"
      volumeMounts:
      - name: gcp-creds
        mountPath: /root/.config/gcloud
        readOnly: true
      - name: lake-drainage-volume
        mountPath: /data