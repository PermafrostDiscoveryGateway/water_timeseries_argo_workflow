apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: create-historical-zarr-archive
  namespace: argo
  annotations:
    workflows.argoproj.io/pod-keep: "OnCompletion"
spec:
  # Run daily at 4:30 PM CST (22:30 UTC) - after merge-new-region-results and
  # create-new-historical-file (both 45 17 * * *) have had time to finish.
  # Adjust timezone as needed - this is UTC time
  schedule: "30 22 * * *"
  # Forbid - prevents new workflow from starting if one is already running
  concurrencyPolicy: "Forbid"
  # How long to wait for the workflow to start before giving up (5 minutes)
  startingDeadlineSeconds: 300
  # How many successful workflow executions to keep
  successfulJobsHistoryLimit: 3
  # How many failed workflow executions to keep
  failedJobsHistoryLimit: 3
  # Suspend the cron workflow if needed (false by default)
  suspend: false
  workflowSpec:
    ttlStrategy:
      secondsAfterCompletion: 86400
    entrypoint: main

    podResourceRequest:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "1Gi"

    podSpecPatch: |
      initContainers:
      - name: init
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "1Gi"
      containers:
      - name: wait
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "1Gi"
      - name: main
        resources:
          requests:
            cpu: "8"
            memory: "32Gi"
            ephemeral-storage: "8Gi"
          limits:
            cpu: "16"
            memory: "48Gi"
            ephemeral-storage: "16Gi"

    artifactRepository:
      pvc:
        claimName: argo-workflows-share
        key: artifacts

    artifactGC:
      strategy: Never

    imagePullSecrets:
    - name: ghcr-secret

    volumes:
    - name: lake-drainage-volume
      persistentVolumeClaim:
        claimName: argo-workflows-share

    templates:
    - name: main
      metadata:
        labels:
          long-running-job: "true"
      inputs: {}
      outputs:
        artifacts:
        - name: workflow-output
          path: /tmp/workflow_output.log
          archive:
            none: {}
      container:
        image: ghcr.io/permafrostdiscoverygateway/water_timeseries_argo_workflow:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "32Gi"
            cpu: "8"
            ephemeral-storage: "8Gi"
        command: ["bash", "-c"]
        args:
          - |
            set -e
            set -x

            # Create log directory and file for artifact
            mkdir -p /tmp
            exec > >(tee -a /tmp/workflow_output.log) 2>&1

            echo "=== STARTING CREATE HISTORICAL ZARR ARCHIVE JOB ==="
            echo "Timestamp: $(date)"
            echo "Pod: ${POD_NAME:-unknown}"

            # Create debug directory on PVC for long-term storage
            DEBUG_DIR="/data/water_timeseries/debug_$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$DEBUG_DIR"

            # Also tee to PVC for persistence
            exec > >(tee -a "$DEBUG_DIR/script_output.log") 2>&1

            # Check resources
            echo "=== RESOURCE ALLOCATION ==="
            free -h
            echo "CPU count: $(nproc)"
            df -h /
            df -h /data

            # Debug Python environment
            echo "=== PYTHON ENVIRONMENT ==="
            which python
            python --version

            # Set environment variables
            export TMPDIR=/data/water_timeseries/temp_netcdf
            export TEMP=/data/water_timeseries/temp_netcdf
            export TMP=/data/water_timeseries/temp_netcdf

            # Dask-specific environment variables
            export DASK_TEMPORARY_DIRECTORY=/data/water_timeseries/dask_work_space
            export DASK_DISTRIBUTED__WORKER__MEMORY__TARGET=0.7
            export DASK_DISTRIBUTED__WORKER__MEMORY__SPILL=0.8
            export DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE=0.95
            export DASK_SCHEDULER=threads
            export DASK_NUM_THREADS=$(nproc)

            # Clean PYTHONPATH - use only the venv
            export PYTHONPATH="/app/.venv/lib/python3.12/site-packages:/app"

            # Check PVC space
            echo "=== PVC STORAGE ==="
            df -h /data

            # Create .env file
            echo "=== CREATING .env FILE ==="
            mkdir -p /data/combine_historical_archive
            cat > /data/combine_historical_archive/.env << 'EOF'
            project=pdg-project-406720
            base_dir=/data/water_timeseries
            output_dir=/data/water_timeseries/output
            combined_zarr_datasets=/data/water_timeseries/combined_zarr_datasets
            combine_all=True
            EOF

            # Save environment info to PVC
            echo "=== SAVING ENVIRONMENT INFO ==="
            env | sort > "$DEBUG_DIR/environment.txt"
            pip list > "$DEBUG_DIR/pip_list.txt"

            # Run the script with unbuffered output
            echo "=== RUNNING SCRIPT ==="
            cd /app

            # Use python -u for unbuffered output and capture exit code properly
            python -u /app/near_real_time/combine_results_into_zarr_historical_archive.py /data/combine_historical_archive/.env
            SCRIPT_EXIT_CODE=$?

            echo "=== SCRIPT COMPLETED with exit code: $SCRIPT_EXIT_CODE ==="

            # Check for output files
            if [ -d "/data/water_timeseries/combined_zarr_datasets" ]; then
              echo "Combined archives:"
              ls -lh /data/water_timeseries/combined_zarr_datasets/
            fi

            echo "=== DEBUG INFO SAVED TO: $DEBUG_DIR ==="
            echo "=== FULL LOG SAVED TO: /tmp/workflow_output.log ==="

            # Ensure everything is flushed to disk
            sync

            exit $SCRIPT_EXIT_CODE
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TMPDIR
          value: "/data/water_timeseries/temp_netcdf"
        - name: DASK_TEMPORARY_DIRECTORY
          value: "/data/water_timeseries/dask_work_space"
        - name: DASK_NUM_THREADS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: "1"
        - name: OMP_NUM_THREADS
          value: "1"
        volumeMounts:
        - name: lake-drainage-volume
          mountPath: /data
