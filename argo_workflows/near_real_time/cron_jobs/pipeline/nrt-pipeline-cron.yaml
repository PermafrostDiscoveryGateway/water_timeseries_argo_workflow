apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: nrt-pipeline-cron
  namespace: argo
  annotations:
    workflows.argoproj.io/pod-keep: "OnCompletion"
spec:
  # Kicks off the whole nightly pipeline. Downstream stages are gated by
  # `depends` in the DAG below, not by clock offsets - this is just "start
  # the day's run".
  schedule: "20 12 * * *"
  concurrencyPolicy: "Forbid"
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  workflowSpec:
    ttlStrategy:
      secondsAfterCompletion: 86400
    entrypoint: main

    # Pod-level fields like volumes/imagePullSecrets/artifactRepository on the
    # referenced WorkflowTemplate only apply when that template runs directly.
    # Since tasks below call into nrt-pipeline-templates via templateRef, the
    # pod is actually built from this workflowSpec, so these must be
    # duplicated here to match.
    imagePullSecrets:
    - name: ghcr-secret

    artifactRepository:
      pvc:
        claimName: argo-workflows-share
        key: artifacts

    volumes:
    - name: lake-drainage-volume
      persistentVolumeClaim:
        claimName: argo-workflows-share
    - name: gcp-creds
      secret:
        secretName: personal-gcp-creds
        items:
        - key: key.json
          path: application_default_credentials.json
    - name: earth-engine-creds
      secret:
        secretName: earth-engine-creds
        items:
        - key: credentials
          path: credentials

    arguments:
      parameters:
      - name: regions
        value: |
          [
            {"region_name": "ALASKA",   "id_chunk_size": "",     "save_interval": "", "n_jobs": ""},
            {"region_name": "CANADA1",  "id_chunk_size": "500",  "save_interval": "1", "n_jobs": "4"},
            {"region_name": "CANADA2",  "id_chunk_size": "500",  "save_interval": "1", "n_jobs": "2"},
            {"region_name": "CANADA3",  "id_chunk_size": "500",  "save_interval": "1", "n_jobs": "2"},
            {"region_name": "CANADA4",  "id_chunk_size": "500",  "save_interval": "1", "n_jobs": "4"},
            {"region_name": "EURASIA1", "id_chunk_size": "1000", "save_interval": "1", "n_jobs": "4"},
            {"region_name": "EURASIA2", "id_chunk_size": "1000", "save_interval": "1", "n_jobs": "2"},
            {"region_name": "EURASIA3", "id_chunk_size": "",     "save_interval": "", "n_jobs": ""},
            {"region_name": "TEST",     "id_chunk_size": "",     "save_interval": "", "n_jobs": ""}
          ]
      # How many merge -> backfill rounds to try before giving up and moving
      # on with whatever completeness was reached. Kept low on purpose: a
      # region still short of the threshold after one backfill round is more
      # likely waiting on data that just isn't there yet (or isn't there at
      # all) than on something a same-day retry will fix - further attempts
      # happen tomorrow, when download-region has had a full day to make
      # progress and download-region-last-attempts (after day 15) can weigh in.
      - name: max-backfill-attempts
        value: "2"

    templates:
    - name: main
      dag:
        tasks:

        # Fan out: one region-pipeline per region, fully independent of every
        # other region's progress. Each item runs its own
        # download -> merge+backfill -> process chain in sequence, so a
        # region that finishes early doesn't wait on a slower one, but a
        # single DAG task can still enforce that ordering for its own region.
        - name: regions
          templateRef:
            name: nrt-pipeline-templates
            template: region-pipeline
          arguments:
            parameters:
            - name: region_name
              value: "{{item.region_name}}"
            - name: id_chunk_size
              value: "{{item.id_chunk_size}}"
            - name: save_interval
              value: "{{item.save_interval}}"
            - name: n_jobs
              value: "{{item.n_jobs}}"
            - name: max-backfill-attempts
              value: "{{workflow.parameters.max-backfill-attempts}}"
          withParam: "{{workflow.parameters.regions}}"

        # Only runs once every region's full pipeline (including process) has finished,
        # since it combines each region's breakpoint output.
        - name: create-historical-zarr-archive
          depends: "regions"
          templateRef:
            name: nrt-pipeline-templates
            template: create-historical-zarr-archive

        # Decoupled from create-historical-zarr-archive/regions on purpose: this only
        # needs every region's *merge* output (dw_{region}_{date}.nc), not process, so
        # it doesn't need to wait behind the (much slower) process step. It has no
        # `depends`, so it starts as soon as the workflow does and polls on its own,
        # on a cheap pod, until every region's merge file for the target month shows
        # up (or merge_wait_minutes is exceeded) - see wait-for-region-merges.
        - name: wait-for-region-merges
          templateRef:
            name: nrt-pipeline-templates
            template: wait-for-region-merges

        # Only starts once wait-for-region-merges confirms merges are ready, so the
        # much heavier create-new-historical-file pod isn't sitting reserved for
        # however long the region pipelines take.
        - name: create-historical-file
          depends: "wait-for-region-merges"
          templateRef:
            name: nrt-pipeline-templates
            template: create-new-historical-file

        # Last step: builds the NRT dashboard's PMTiles archive for the latest
        # month in the combined breakpoint zarr. Waits on create-historical-file
        # too so it's the final thing the pipeline does, but still runs if that
        # step failed, since it only reads the zarr archive. Runs with
        # OVERWRITE=False, so a month that's already built is skipped - use
        # manual_jobs/create-nrt-pmtiles.yaml to force a rebuild.
        - name: create-nrt-pmtiles
          depends: "create-historical-zarr-archive && (create-historical-file.Succeeded || create-historical-file.Failed || create-historical-file.Errored)"
          templateRef:
            name: nrt-pipeline-templates
            template: create-nrt-pmtiles
