apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: create-nrt-pmtiles-
  namespace: argo
  annotations:
    workflows.argoproj.io/pod-keep: "OnCompletion"
spec:
  # One-off, manually-submitted run (not a CronWorkflow) that builds the NRT
  # dashboard's PMTiles archive (nrt_<month>_drainage.pmtiles) for the latest
  # month in the most recent combined breakpoint zarr.
  #
  # The daily pipeline already runs create-nrt-pmtiles as its last step, with
  # OVERWRITE=False, so it skips a month that's already built. Use this job
  # to force a rebuild of the latest month (e.g. after the combined zarr was
  # regenerated). `overwrite` is passed to create_nrt_pmtiles.py as OVERWRITE:
  #   - "True"  (default): rebuild the latest month even if it's already built
  #   - "False": same as the pipeline step, only build if it isn't already
  # Override at submit time with e.g. `argo submit ... -p overwrite=False`.
  #
  # Don't run this while the daily pipeline's create-nrt-pmtiles step is
  # running. Both share nrt_precomputed_dir and seed from whichever
  # nrt_monthly_drain_breaks*.parquet there has the latest mtime
  # (find_previous_breaks_file), so if they overlap, one run's month is
  # dropped from whichever table ends up newest. The main template below
  # takes the same `nrt-precomputed-dir` mutex as that step, so Argo queues
  # this job until the pipeline step finishes (and vice versa).
  entrypoint: main

  arguments:
    parameters:
    - name: overwrite
      value: "True"

  ttlStrategy:
    secondsAfterCompletion: 86400

  imagePullSecrets:
  - name: ghcr-secret

  artifactRepository:
    pvc:
      claimName: argo-workflows-share
      key: artifacts

  volumes:
  - name: lake-drainage-volume
    persistentVolumeClaim:
      claimName: argo-workflows-share

  templates:
  - name: main
    synchronization:
      mutexes:
        - name: nrt-precomputed-dir
    metadata:
      labels:
        long-running-job: "true"
    outputs:
      artifacts:
      - name: workflow-output
        path: /tmp/workflow_output.log
        archive:
          none: {}
    container:
      image: ghcr.io/permafrostdiscoverygateway/water_timeseries_argo_workflow:latest
      imagePullPolicy: Always
      resources:
        requests:
          memory: "8Gi"
          cpu: "2"
          ephemeral-storage: "8Gi"
        limits:
          memory: "14Gi"
          cpu: "2"
          ephemeral-storage: "16Gi"
      command: ["bash", "-c"]
      args:
        - |
          set -e
          set -x
          STAGE="create_nrt_pmtiles"
          OVERWRITE="{{workflow.parameters.overwrite}}"

          mkdir -p /tmp
          exec > >(tee -a /tmp/workflow_output.log) 2>&1

          echo "=== STARTING MANUAL JOB: $STAGE (OVERWRITE=$OVERWRITE) ==="
          echo "Timestamp: $(date)"

          WORKFLOW_NAME="{{workflow.name}}"
          DEBUG_DIR="/data/water_timeseries/debug/debug_${WORKFLOW_NAME}_$(date +%Y%m%d_%H%M%S)_${STAGE}"
          mkdir -p "$DEBUG_DIR"
          exec > >(tee -a "$DEBUG_DIR/script_output.log") 2>&1

          export PYTHONPATH="/app/.venv/lib/python3.12/site-packages:/app"

          SCRATCH_DIR="/data/scratch/${STAGE}_manual"
          mkdir -p "$SCRATCH_DIR"
          cat > "$SCRATCH_DIR/.env" << EOF
          project=pdg-project-406720
          base_dir=/data/water_timeseries
          combined_zarr_datasets=/data/water_timeseries/combined_zarr_datasets
          vector_lake_file=/data/water_timeseries/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet
          nrt_precomputed_dir=/data/water_timeseries/precomputed_nrt
          nrt_pmtiles_output_dir=/data/water_timeseries/nrt_tiles
          drain_threshold=-0.25
          nrt_poly_max_zoom=14
          nrt_drain_breaks_keep=5
          OVERWRITE=${OVERWRITE}
          MANUAL=True
          EOF

          cd /app
          SCRIPT_EXIT_CODE=0
          python -u /app/near_real_time/create_nrt_pmtiles.py "$SCRATCH_DIR/.env" || SCRIPT_EXIT_CODE=$?

          echo "=== $STAGE completed with exit code: $SCRIPT_EXIT_CODE ==="
          sync
          exit $SCRIPT_EXIT_CODE
      env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: OMP_NUM_THREADS
        value: "1"
      volumeMounts:
      - name: lake-drainage-volume
        mountPath: /data
