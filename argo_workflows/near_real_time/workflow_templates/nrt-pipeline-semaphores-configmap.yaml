apiVersion: v1
kind: ConfigMap
metadata:
  name: nrt-pipeline-semaphores
  namespace: argo
data:
  # Max number of download-region + download-missing-region pods that may run
  # at once, cluster-wide, combined (referenced by those templates in
  # nrt-pipeline-templates.yaml via synchronization.semaphores.configMapKeyRef).
  # Raise/lower this to trade off pipeline throughput against how hard we hit
  # Earth Engine's per-project concurrency limit.
  download-concurrency: "3"
  # Max number of download-region-last-attempts pods that may run at once,
  # cluster-wide - kept separate from download-concurrency so a region that
  # has already finished downloading+merging isn't stuck queued behind other
  # regions' still-active download retries just to run what is, most days
  # (before day 15 of the month), a fast no-op check. Only actually hits
  # Earth Engine when there are parked no-data IDs to retry, so this can stay
  # small without meaningfully touching EE's concurrency limit.
  last-attempts-concurrency: "2"
  # Max number of process-region pods that may run at once, cluster-wide.
  # process-region is the heaviest single stage in the pipeline (memory/cpu),
  # and region-pipeline fans out independently per region with nothing else
  # gating them - without this, several regions finishing their download+merge
  # around the same time could all launch process-region simultaneously.
  # Keep at 1 on a smaller cluster; raise only if node capacity allows more
  # than one to run comfortably at once.
  process-concurrency: "1"
