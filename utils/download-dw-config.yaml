apiVersion: v1
kind: ConfigMap
metadata:
  name: download-dw-config
  namespace: argo
data:
  config.yaml: |
    # Earth Engine configuration
    ee:
      project: "pdg-project-406720"
      auth: true
    
    # Default datasets
    vector_dataset: "/data/water_time_series_v2/input/lake_polygons.parquet"
    
    # Default output locations  
    output:
      base_path: "/data/water_time_series_v2/output"
      format: "zarr"
    
    # Processing defaults
    defaults:
      years: [2024]
      months: [7, 8, 9, 10]