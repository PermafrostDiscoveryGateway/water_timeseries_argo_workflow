apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: water-timeseries-download-dynamic-world
  namespace: argo
spec:
  entrypoint: main
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnPodCompletion

  arguments:
    parameters:
    - name: years
      value: "2024"
    - name: months
      value: "7,8"

  templates:
  - name: main
    retryStrategy:
      limit: "2"
      retryPolicy: "OnFailure"

    script:
      image: ghcr.io/permafrostdiscoverygateway/water_timeseries_argo_workflow:main
      imagePullPolicy: Always
      command: [python]
      source: |
        import os
        import sys
        import toml
        from loguru import logger
        from water_timeseries.downloader import EarthEngineDownloader
        import nest_asyncio
        
        nest_asyncio.apply()
        
        # Load config
        config_path = "/app/config/config.toml"
        with open(config_path, 'r') as f:
            config = toml.load(f)
        
        # Get parameters
        ee_project = config['ee']['project']
        vector_dataset = config.get('vector_dataset', '/data/water_time_series_v2/input/lake_polygons.parquet')
        
        years = [int(y) for y in "{{workflow.parameters.years}}".split(",")]
        months = [int(m) for m in "{{workflow.parameters.months}}".split(",")]
        
        # Build output path
        save_to_file = f"/data/water_time_series_v2/dynamic_world/dw_monthly_{years[0]}_{','.join(map(str, months))}.zarr"
        
        # Set environment
        os.environ["EE_PROJECT"] = ee_project
        
        logger.info(f"Using EE Project: {ee_project}")
        logger.info(f"Years: {years}, Months: {months}")
        logger.info(f"Vector dataset: {vector_dataset}")
        logger.info(f"Save to: {save_to_file}")
        
        # Download
        dl = EarthEngineDownloader(ee_auth=True, logger=logger)
        ds = dl.download_dw_monthly(
            vector_dataset=vector_dataset,
            name_attribute="id_geohash",
            years=years,
            months=months,
            save_to_file=save_to_file,
        )
        
        logger.info(f"Successfully downloaded data to {save_to_file}")

      env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: /root/.config/gcloud/application_default_credentials.json
      - name: PYTHONPATH
        value: /app

      volumeMounts:
      - name: temp-storage
        mountPath: /tmp
      - name: water-timeseries-volume
        mountPath: /data
      - name: gcp-creds
        mountPath: /root/.config/gcloud
        readOnly: true
      - name: config
        mountPath: /app/config
        readOnly: true

      resources:
        requests:
          memory: "2Gi"
          cpu: "1"
          ephemeral-storage: "7Gi"
        limits:
          memory: "6Gi"
          cpu: "2"
          ephemeral-storage: "8Gi"

      imagePullSecrets:
      - name: ghcr-secret

  volumes:
  - name: water-timeseries-volume
    persistentVolumeClaim:
      claimName: argo-workflows-share
  - name: temp-storage
    emptyDir:
      sizeLimit: 20Gi
  - name: gcp-creds
    secret:
      secretName: personal-gcp-creds
      items:
      - key: key.json
        path: application_default_credentials.json
  - name: config
    configMap:
      name: download-dw-config