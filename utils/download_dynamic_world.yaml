apiVersion: batch/v1
kind: Job
metadata:
  name: water-timeseries-download-dynamic-world
  namespace: argo
  annotations:
    workflows.argoproj.io/pod-keep: "OnCompletion"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        job-type: data-download
        app: water-timeseries
    spec:
      restartPolicy: OnFailure

      imagePullSecrets:
      - name: ghcr-secret

      volumes:
      # Shared volume for data
      - name: water-timeseries-volume
        persistentVolumeClaim:
          claimName: argo-workflows-share

      # GCP credentials
      - name: gcp-creds
        secret:
          secretName: personal-gcp-creds
          items:
          - key: key.json
            path: application_default_credentials.json

      # Config volume
      - name: config
        configMap:
          name: download-dw-config

      containers:
      - name: download-script
        image: ghcr.io/permafrostdiscoverygateway/water_timeseries_argo_workflow:main
        imagePullPolicy: Always

        command: ["python"]
        args:
        - "/app/google_cloud_utils/download_dw_monthly.py"
        - "--config"
        - "/app/config/config.yaml"
        # Override specific parameters via command line
        - "--years"
        - "2024"
        - "--months"
        - "7,8"
        - "--vector-dataset"
        - "/data/water_time_series_v2/input/lake_polygons.parquet"
        - "--save-to"
        - "/data/water_time_series_v2/dynamic_world/dw_monthly_2024_7_8.zarr"

        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /root/.config/gcloud/application_default_credentials.json
        - name: PYTHONPATH
          value: /app
        - name: EE_PROJECT
          valueFrom:
            configMapKeyRef:
              name: water-timeseries-config
              key: ee.project
              # Or use: value: "pdg-project-406720"

        volumeMounts:
        - name: gcp-creds
          mountPath: /root/.config/gcloud
          readOnly: true
        - name: water-timeseries-volume
          mountPath: /data
        - name: config
          mountPath: /app/config

        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            ephemeral-storage: "10Gi"
          limits:
            memory: "8Gi"
            cpu: "4"
            ephemeral-storage: "20Gi"