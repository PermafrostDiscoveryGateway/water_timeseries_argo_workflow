# Local snakemake version of the nrt-pipeline-cron-test Argo workflow.
# Override any value on the command line, e.g.:
#   snakemake -s snakemake/Snakefile --cores 2 --config target_date=2025-08

# Month to run the whole pipeline against (YYYY-MM). Passed to every stage as
# `target_date`, which utils.date_gate.most_recent_summer_month() returns in
# place of the "most recent complete summer month" a test run normally uses.
target_date: "2025-08"

# Must stay in sync with utils.region_boundaries.get_small_regions(): with
# test_run=True, wait-for-region-merges / create-new-historical-file expect
# merge output for exactly that set of regions.
regions:
  TEST:     {id_chunk_size: "", save_interval: "", n_jobs: ""}
  EURASIA3: {id_chunk_size: "", save_interval: "", n_jobs: ""}

# Time limit for each region's download step, in hours: the full download and
# its missing-ID fallback together. Regions not listed get `default`. Only
# used where steps are Slurm jobs (Delta); local runs have no limit.
#
# A Slurm job on Delta's cpu partition can run at most 48 hours, so a longer
# limit is split into back-to-back 48-hour jobs: when one is killed at its
# limit, snakemake resubmits the download, which skips the tiles already on
# disk and carries on. E.g. 96 = up to two 48-hour jobs.
download_runtime_hours:
  default: 4
  ALASKA: 12
  EURASIA3: 24
  EURASIA1: 96
  EURASIA2: 96
  CANADA1: 96
  CANADA2: 96
  CANADA3: 96
  CANADA4: 96

# Python environment for the near_real_time/ scripts. With build: true,
# snakemake builds it with uv the same way the Docker image is built:
#   1. base: water-timeseries-v2 (the ghcr.io/.../water-timeseries-v2 base image)
#   2. extras: envs/requirements-extra.txt (this repo's Dockerfile layer)
# It's only rebuilt when base_package, python_version or the extras file
# change, and a rebuild doesn't re-run pipeline steps that already finished.
# With build: false, `python` below is used as-is.
environment:
  build: true
  uv: "uv"
  path: "snakemake/.venv"
  python_version: "3.12"
  # Anything `uv pip install` accepts. The image tag ncsa-water-timeseries is
  # built from the branch of the same name. For a local checkout instead:
  #   base_package: "-e ../water-timeseries-v2"
  base_package: "water-timeseries @ git+https://github.com/PermafrostDiscoveryGateway/water-timeseries-v2.git@ncsa-water-timeseries"
  extra_requirements: "snakemake/envs/requirements-extra.txt"
  # tippecanoe release (https://github.com/felt/tippecanoe) built into the
  # env's bin/ for create_nrt_pmtiles. "" = skip it and use a tippecanoe
  # already on PATH (e.g. `brew install tippecanoe`).
  tippecanoe_version: "2.79.0"

# Only used when environment.build is false.
python: "../water-timeseries-v2/.venv/bin/python"

# Local equivalents of the /data/water_timeseries paths in
# nrt-pipeline-templates-test.yaml. Relative paths are resolved against the
# repo root.
paths:
  base_dir: "data"
  dynamic_world_data: "data/dynamic_world_test"
  vector_lake_file: "data/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet"
  region_lake_polygons_dir: "data/region_lake_polygons"
  output_dir: "data/output_test"
  combined_zarr_datasets: "data/combined_zarr_datasets"
  # create_nrt_pmtiles: the running drain-breaks table and the published
  # nrt_<month>_drainage.pmtiles archives.
  nrt_precomputed_dir: "data/precomputed_nrt"
  nrt_pmtiles_output_dir: "data/nrt_tiles"
  # Snakemake's own bookkeeping: per-stage .env files, logs, done-markers.
  work_dir: "data/snakemake_work"

# TMPDIR and Dask spill directory for every step. Empty = base_dir/temp_netcdf
# and base_dir/dask_work_space, as in the Argo pods.
scratch:
  temp_dir: ""
  dask_dir: ""

# Credential files, set for every step the way the Argo pods mount the
# personal-gcp-creds / earth-engine-creds secrets. Empty = use your own
# `gcloud auth application-default login` / `earthengine authenticate` as-is.
credentials:
  # -> GOOGLE_APPLICATION_CREDENTIALS (secret personal-gcp-creds, key key.json)
  gcloud_adc: ""
  # Copied to a private per-step HOME/.config/earthengine/credentials
  # -> EARTHENGINE_TOKEN, EE_CONFIG_DIR, HOME (secret earth-engine-creds, key credentials)
  earthengine: ""

# create_nrt_pmtiles settings - the same .env values as the Argo step
# (nrt-pipeline-templates-test.yaml on branch 56).
pmtiles:
  drain_threshold: -0.25
  poly_max_zoom: 14
  drain_breaks_keep: 5
  # Pipeline step only: rebuild the month even if its archive already exists
  # (Argo: OVERWRITE=False). Snakefile.pmtiles always rebuilds.
  overwrite: false
  # Inputs/outputs Snakefile.pmtiles can build from (--config pmtiles_dataset=...).
  # "test" is this pipeline's own output (the paths above). Any of
  # combined_zarr_datasets / nrt_precomputed_dir / nrt_pmtiles_output_dir set
  # here replaces the matching path.
  datasets:
    test: {}
    main:
      # E.g. a copy of the Argo pipeline's /data/water_timeseries/combined_zarr_datasets.
      combined_zarr_datasets: ""
      nrt_precomputed_dir: "data/main/precomputed_nrt"
      nrt_pmtiles_output_dir: "data/main/nrt_tiles"

# Same GCP / Earth Engine settings the Argo pods export. Local Earth Engine
# auth (`earthengine authenticate`) is used as-is.
earth_engine:
  project: "pdg-project-406720"
  EE_CLOUD_PROJECT: "pdg-wg-workflow"
  EE_PROJECT: "pdg-project-406720"
  vector_dataset_file_url: "pdg-storage-default/water_timeseries_v2/data/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet"
  bucket_path: "pdg-storage-default/water_timeseries_v2/data/input"

# The merge -> backfill -> re-merge round in merge-and-backfill-region-loop.
# Downloads are only tried once here, so this is a single backfill between
# the first and second merge (equivalent to max-backfill-attempts: 2).
backfill_after_failed_merge: true

merge_wait_minutes: 5
