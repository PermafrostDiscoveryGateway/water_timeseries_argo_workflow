# Delta (NCSA, ACCESS) overrides for config.yaml. Use together with the Slurm
# profile:
#   snakemake -s snakemake/Snakefile --configfile snakemake/config.delta.yaml \
#       --profile snakemake/profiles/delta --config target_date=2025-08
#
# Keys not set here come from config.yaml. $VARS and ~ are expanded.

# The Argo workflows' shared PVC (mounted at /data in the pods) lives on
# Taiga, so /data/water_timeseries in the Argo templates is:
#   /taiga/ncsa/radiant/bbfa/software-dev/argo-argo-workflows-share-pvc-082f0001-1fbe-4f7d-91d7-410c880ebd26/water_timeseries
# That directory is live Argo state, so only read-only inputs (the lake
# vectors) are taken from it.
#
# Layout on Delta (see the Delta data management docs):
#   /projects/biyc/water_timeseries   shared, persistent: this repo checkout
#                                     and the venv
#   /work/hdd/biyc/water_timeseries   everything jobs read and write (Delta's
#                                     scratch replacement, larger quota)
# Both are shared by the biyc group; keep them group-writable (g+rwX, setgid
# on directories) so anyone on the allocation can run the pipeline.
#
# dynamic_world_data is both input and output: download/merge/process expect
# the historical lakes_dw_*.nc file(s) in it, and write downloads/, merge/ and
# the new historical file next to them. Seed it once from the Argo test data:
#   mkdir -p /work/hdd/biyc/water_timeseries/dynamic_world_data
#   ln -s <taiga water_timeseries>/test/dynamic_world_data/*.nc \
#         /work/hdd/biyc/water_timeseries/dynamic_world_data/
paths:
  base_dir: "/work/hdd/biyc/water_timeseries"
  dynamic_world_data: "/work/hdd/biyc/water_timeseries/dynamic_world_data"
  vector_lake_file: "/taiga/ncsa/radiant/bbfa/software-dev/argo-argo-workflows-share-pvc-082f0001-1fbe-4f7d-91d7-410c880ebd26/water_timeseries/input/Nitze_etal_Lakes_filtered_full_set_V2d.parquet"
  region_lake_polygons_dir: "/taiga/ncsa/radiant/bbfa/software-dev/argo-argo-workflows-share-pvc-082f0001-1fbe-4f7d-91d7-410c880ebd26/water_timeseries/region_lake_polygons"
  output_dir: "/work/hdd/biyc/water_timeseries/output"
  combined_zarr_datasets: "/work/hdd/biyc/water_timeseries/combined_zarr_datasets"
  # Markers, logs and per-stage .env files. Must be on a filesystem the login
  # node and the compute nodes share.
  work_dir: "/work/hdd/biyc/water_timeseries/snakemake_work"

# Node-local disk on the compute node, so temp NetCDF and Dask spill I/O
# don't go over the shared filesystem. Nothing in it is needed after a step.
scratch:
  temp_dir: "/tmp/$USER/water_timeseries/temp_netcdf"
  dask_dir: "/tmp/$USER/water_timeseries/dask_work_space"

# The same credentials the Argo pods use, copied from the cluster secrets
# (run on a machine with kubectl access; nothing is written locally):
#   kubectl -n argo get secret personal-gcp-creds -o jsonpath='{.data.key\.json}' | base64 -d \
#     | ssh login.delta.ncsa.illinois.edu 'umask 077; mkdir -p ~/.config/water_timeseries && cat > ~/.config/water_timeseries/application_default_credentials.json'
#   kubectl -n argo get secret earth-engine-creds -o jsonpath='{.data.credentials}' | base64 -d \
#     | ssh login.delta.ncsa.illinois.edu 'umask 077; mkdir -p ~/.config/water_timeseries && cat > ~/.config/water_timeseries/earthengine_credentials'
credentials:
  gcloud_adc: "~/.config/water_timeseries/application_default_credentials.json"
  earthengine: "~/.config/water_timeseries/earthengine_credentials"

# Home directories on Delta are small; keep the venv under /projects, next to
# the repo checkout. It is built on the login node (build_env is a local rule)
# and used by every job.
environment:
  path: "/projects/biyc/water_timeseries/venv"
