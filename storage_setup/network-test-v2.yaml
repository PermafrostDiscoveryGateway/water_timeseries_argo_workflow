apiVersion: v1
kind: Pod
metadata:
  name: network-test-v2
  namespace: argo
spec:
  containers:
  - name: test
    image: alpine:latest
    command: ["sh", "-c"]
    args:
    - |
      echo "Testing connectivity to NEW Filestore IP: 10.30.59.242"
      apk add --no-cache nmap
      
      echo -e "\n1. Testing NFS port 2049:"
      timeout 5 nc -zv 10.30.59.242 2049 && echo "Port 2049 OPEN" || echo "Port 2049 CLOSED"
      
      echo -e "\n2. Testing RPC port 111:"
      timeout 5 nc -zv 10.30.59.242 111 && echo "Port 111 OPEN" || echo "Port 111 CLOSED"
      
      echo -e "\n3. Testing mountd port 20048:"
      timeout 5 nc -zv 10.30.59.242 20048 && echo "Port 20048 OPEN" || echo "Port 20048 CLOSED"
      
      echo -e "\n4. Full port scan:"
      nmap -p 111,2049,20048 10.30.59.242
      
      sleep 300
    securityContext:
      runAsUser: 0
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
