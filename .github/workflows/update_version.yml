name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional)'
        required: false
        type: string

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Docker tags
        id: docker_tags
        run: |
          # Base tags
          TAGS="ghcr.io/ncsa/water_timeseries_argo_workflow:${GITHUB_SHA::8}"
          
          # Always add 'latest' tag for main branch
          TAGS="${TAGS},ghcr.io/ncsa/water_timeseries_argo_workflow:latest"
          
          # Add branch name tag
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//-/g')
          TAGS="${TAGS},ghcr.io/ncsa/water_timeseries_argo_workflow:${BRANCH_NAME}"
          
          # If manual dispatch with custom tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS},ghcr.io/ncsa/water_timeseries_argo_workflow:${{ inputs.tag }}"
            echo "Adding custom tag: ${{ inputs.tag }}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          
          # Also output just the tags for debugging
          echo "tags_output=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=$(date -Iseconds)
            org.opencontainers.image.description="Argo Workflows for water timeseries analysis"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest output
        run: |
          echo "Image built and pushed with tags: ${{ steps.docker_tags.outputs.tags_output }}"