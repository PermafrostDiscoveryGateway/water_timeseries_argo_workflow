name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional)'
        required: false
        type: string

# Add default permissions at workflow level
permissions:
  contents: read
  packages: write

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Docker tags (lowercase)
        id: docker_tags
        run: |
          # Convert repository name to lowercase for GHCR
          REPO_LOWER="${{ github.repository }}"
          REPO_LOWER="${REPO_LOWER,,}"
          
          REGISTRY="ghcr.io/${REPO_LOWER}"
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Start with branch name tag
          TAGS="${REGISTRY}:${BRANCH_NAME}"
          
          # Add 'latest' tag for main branch only
          if [ "$BRANCH_NAME" == "main" ]; then
            TAGS="${TAGS},${REGISTRY}:latest"
          fi
          
          # Add commit SHA tag (optional - remove if you don't want it)
          TAGS="${TAGS},${REGISTRY}:${GITHUB_SHA::8}"
          
          # If manual dispatch with custom tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS},${REGISTRY}:${{ inputs.tag }}"
            echo "Adding custom tag: ${{ inputs.tag }}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          
          # Debug output
          echo "Repository original: ${{ github.repository }}"
          echo "Repository lowercase: ${REPO_LOWER}"
          echo "Will push to: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=$(date -Iseconds)
            org.opencontainers.image.description="Argo Workflows for water timeseries analysis"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest output
        run: |
          echo "✅ Successfully pushed:"
          echo "${{ steps.docker_tags.outputs.tags }}" | tr ',' '\n'